name: Publish NuGet packages

on:
  push:
    tags:
      - "v_[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v_}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        run: dotnet restore library/full/src ; dotnet restore library/lang/src
      - name: Restore resources
        run: . .\download_resources.ps1
      - name: Build
        run: dotnet build library/full/src -c Release ; dotnet build library/lang/src -c Release
      - name: Pack
        run: |
          nuget pack library/full/nuget/SharpOpenJTalk.nuspec -Version ${{ steps.version.outputs.version }}
          nuget pack library/lang/nuget/SharpOpenJTalk.Lang.nuspec -Version ${{ steps.version.outputs.version }}
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet.org
        run: |
          dotnet nuget push *.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create GitHub Release
        run: gh release create ${{ github.ref_name }} --generate-notes *.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
